# Publica la imagen de producción en GHCR. SIEMPRE manual (patrón de la casa:
# nadie despliega en el merge): Actions → Deploy → Run workflow → confirm: yes.
# Después, en Dokploy: Deploy (el custom command hace pull de :latest).
name: Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "¿Publicar imagen de producción en GHCR?"
        type: choice
        options: ["yes", "no"]
        default: "no"

jobs:
  build-and-push:
    if: inputs.confirm == 'yes' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR exige el nombre en minúsculas
      - name: Lowercase image name
        id: imagen
        run: echo "nombre=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.imagen.outputs.nombre }}:latest
            ghcr.io/${{ steps.imagen.outputs.nombre }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
