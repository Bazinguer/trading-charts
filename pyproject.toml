[project]
name = "charts"
version = "0.1.0"
description = "Gráficos financieros con análisis técnico persistente (charts.bazinguer.es)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pandas>=2.2",
    "pyarrow>=17",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
# Config de Claude Code (hooks y scripts personales), no es código del proyecto
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
